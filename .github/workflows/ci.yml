name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # New advisories appear without any change to this repo, so re-check weekly.
  schedule:
    - cron: "17 5 * * 1"

# Least privilege by default (same as AudioZero). Only the release job asks for more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: Dependency policy (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  build:
    name: Build & test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-latest, platform: macos-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcursor-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # Fail if Cargo.lock doesn't match the manifests, so CI builds exactly what was reviewed.
      # (`cargo xtask` is an alias that can't take --locked, so this guards it too.)
      - name: Check the lockfile is up to date
        run: cargo fetch --locked

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Keeps the opt-in GPL VST3 path compiling. Never packaged or released.
      - name: Check vst3-gpl feature compiles
        if: runner.os == 'Linux'
        run: cargo check -p kick_me --features vst3-gpl --locked

      - name: Bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo xtask bundle-universal kick_me --release
          else
            cargo xtask bundle kick_me --release
          fi

      - name: Render a test kick
        run: cargo run --release --locked -p nusick-dsp --bin render-kick -- target/bundled/kick-me-demo.wav

      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: kick-me-${{ matrix.platform }}
          path: dist/kick-me-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish "latest" release
    # Never on the weekly schedule, on pull requests or on other branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [licenses, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(echo "$GITHUB_SHA" | cut -c1-7))" \
            --notes "Automatic build of main at $GITHUB_SHA. CLAP plugin and standalone app; MIT licensed (see NOTICE). Builds are unsigned (macOS: run xattr -dr com.apple.quarantine on the files after download). SHA256SUMS.txt lists each zip's checksum." \
            --prerelease
