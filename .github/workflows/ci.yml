name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: License check (no GPL in default build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  build:
    name: Build & test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-latest, platform: macos-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcursor-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Keeps the opt-in GPL VST3 path compiling. Never packaged or released.
      - name: Check vst3-gpl feature compiles
        if: runner.os == 'Linux'
        run: cargo check -p kick_me --features vst3-gpl

      - name: Bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo xtask bundle-universal kick_me --release
          else
            cargo xtask bundle kick_me --release
          fi

      - name: Render a test kick
        run: cargo run --release -p nusick-dsp --bin render-kick -- target/bundled/kick-me-demo.wav

      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: kick-me-${{ matrix.platform }}
          path: dist/kick-me-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Publish "latest" release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [licenses, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(echo "$GITHUB_SHA" | cut -c1-7))" \
            --notes "Automatic build of main at $GITHUB_SHA. CLAP plugin and standalone app; MIT licensed (see NOTICE). macOS builds are unsigned: run xattr -dr com.apple.quarantine on the files after download." \
            --prerelease
