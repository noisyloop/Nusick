# Keeps CI actions and Cargo dependencies current, so security fixes arrive as reviewable PRs.
# nih-plug is pinned to a git revision on purpose (see Cargo.toml); bump it by hand after
# reviewing upstream, and re-check the RUSTSEC ignore in deny.toml when you do.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
