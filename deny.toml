# cargo-deny config: `cargo deny check licenses`.
# Policy: shipped code must be MIT, Apache-2.0, ISC or BSD. Anything else is
# listed below as an explicit, reviewed exception (see NOTICE).

[graph]
all-features = false   # the GPL `vst3-gpl` feature is intentionally excluded
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
]
confidence-threshold = 0.9
exceptions = [
    # Windows clipboard support in egui-baseview. Boost license, permissive.
    { name = "clipboard-win", allow = ["BSL-1.0"] },
    { name = "error-code", allow = ["BSL-1.0"] },
    # egui's built-in fonts (embedded in the binary).
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # Unicode data tables; build-time proc-macro dependency.
    { name = "unicode-ident", allow = ["Unicode-3.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-git = "deny"
allow-git = [
    "https://github.com/robbert-vdh/nih-plug",
    "https://github.com/robbert-vdh/rust-assert-no-alloc",
    "https://github.com/RustAudio/baseview",
    "https://github.com/BillyDM/egui-baseview",
    "https://github.com/micahrj/clap-sys",
    "https://github.com/nicokoch/reflink",
]
