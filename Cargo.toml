[workspace]
resolver = "2"
members = [
    "crates/nusick-dsp",
    "crates/nusick-ui",
    "plugins/kick-me",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Infinati"]
repository = "https://github.com/noisyloop/Nusick"

[workspace.dependencies]
nusick-dsp = { path = "crates/nusick-dsp" }
nusick-ui = { path = "crates/nusick-ui" }
# nih-plug is ISC-licensed. Default features are OFF on purpose: the default
# `vst3` feature pulls in the GPLv3 `vst3-sys` crate. See NOTICE and README.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

# Same policy as AudioZero's workspace: no unsafe code of our own, in any crate. (nih-plug's
# export macros expand to `unsafe` FFI entry points, but lints don't fire inside external macros,
# so the plugin crate can forbid it too. CI would catch it if that ever changed.)
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
